<script type="text/plain" id="q1">Implement and analyze the Selection Sort algorithm with proper time and space complexity discussion.</script>
<script type="text/plain" id="c1">
#include <stdio.h>
#include <conio.h>

/* Time : Best/Avg/Worst = O(n^2) (always n(n-1)/2 comparisons), swaps <= n-1
   Space: O(1) in-place, not stable */
void swap(int *xp, int *yp)
{
    int temp = *xp;
    *xp = *yp;
    *yp = temp;
}

void selectionSort(int arr[], int n)
{
    int i, j, min;
    for (i = 0; i < n - 1; i++)
    {
        min = i;
        for (j = i + 1; j < n; j++)
        {
            if (arr[j] < arr[min])
                min = j;
        }
        swap(&arr[min], &arr[i]);
    }
}

void printArray(int arr[], int size)
{
    int i;
    for (i = 0; i < size; i++)
        printf("%d ", arr[i]);
    printf("\n");
}

int main()
{
    int arr[50];
    int i, n;
    clrscr();
    printf("Enter array size (max 50)\n");
    scanf("%d", &n);
    if (n < 1 || n > 50)
    {
        printf("Invalid size\n");
        getch();
        return 0;
    }
    printf("Enter %d array elements\n", n);
    for (i = 0; i < n; i++)
        scanf("%d", &arr[i]);
    selectionSort(arr, n);
    printf("Sorted array: \n");
    printArray(arr, n);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q2">Implement and analyze the Insertion Sort algorithm with proper time and space complexity discussion.</script>
<script type="text/plain" id="c2">
#include <stdio.h>
#include <conio.h>

/* Time : Best O(n) (already sorted), Average O(n^2), Worst O(n^2) (reverse sorted)
   Space: O(1) in-place, stable */
void printArray(int array[], int size)
{
    int i;
    for (i = 0; i < size; i++)
        printf("%d ", array[i]);
    printf("\n");
}

void insertionSort(int array[], int size)
{
    int step, key, j;
    for (step = 1; step < size; step++)
    {
        key = array[step];
        j = step - 1;
        /* for descending order change key<array[j] to key>array[j] */
        while (j >= 0 && key < array[j])
        {
            array[j + 1] = array[j];
            j--;
        }
        array[j + 1] = key;
    }
}

int main()
{
    int data[] = {9, 5, 1, 4, 3};
    int size = sizeof(data) / sizeof(data[0]);
    clrscr();
    insertionSort(data, size);
    printf("Sorted array in ascending order:\n");
    printArray(data, size);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q3">Implement the Max-Min determination algorithm using the Divide and Conquer strategy and evaluate its efficiency.</script>
<script type="text/plain" id="c3">
#include <stdio.h>
#include <conio.h>
#define MAX 20

/* Comparisons: T(n) = 2T(n/2) + 2, T(2)=1  =>  3n/2 - 2 (best, avg, worst)
   Straight max-min needs 2(n-1) comparisons, so D&C is better.
   Time O(n), Space O(log n) recursion stack */
int A[MAX], max, min;

void MaxMin(int i, int j)
{
    int mid, max1, min1;
    printf("scanning from %d to %d\n", i, j);
    if (i == j)
    {
        max = min = A[i];
        printf("max=%d, min=%d\n", max, min);
    }
    else if (i == j - 1)
    {
        if (A[i] < A[j])
        {
            max = A[j];
            min = A[i];
        }
        else
        {
            max = A[i];
            min = A[j];
        }
        printf("max=%d, min=%d\n", max, min);
    }
    else
    {
        mid = (i + j) / 2;
        MaxMin(i, mid);
        max1 = max;
        min1 = min;
        printf("max1=%d, min1=%d\n", max1, min1);
        MaxMin(mid + 1, j);
        if (max1 > max) max = max1;
        if (min1 < min) min = min1;
        printf("Updated max=%d, min=%d\n", max, min);
    }
}

int main()
{
    int i, j, n;
    clrscr();
    printf("Enter array size (max %d): ", MAX);
    scanf("%d", &n);
    if (n < 1 || n > MAX)
    {
        printf("Invalid size\n");
        getch();
        return 0;
    }
    printf("Enter %d elements separated by space: ", n);
    for (i = 0; i < n; i++)
        scanf("%d", &A[i]);
    printf("Enter start and end index to scan (space separated, 0 to %d): ", n - 1);
    scanf("%d %d", &i, &j);
    if (i < 0 || j >= n || i > j)
    {
        printf("Invalid range\n");
        getch();
        return 0;
    }
    MaxMin(i, j);
    printf("max=%d, min=%d", max, min);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q4">Implement the Quick Sort algorithm and analyze its best, average, and worst-case complexity.</script>
<script type="text/plain" id="c4">
#include <stdio.h>
#include <conio.h>

/* Best   : O(n log n)  pivot splits array in halves
   Average: O(n log n)
   Worst  : O(n^2)      already sorted input (pivot = first element)
   Space  : O(log n) average stack, O(n) worst */
void quicksort(int list[], int low, int high)
{
    int pivot, i, j, temp;
    if (low < high)
    {
        pivot = low;
        i = low;
        j = high;
        while (i < j)
        {
            while (i < high && list[i] <= list[pivot])
                i++;
            while (list[j] > list[pivot])
                j--;
            if (i < j)
            {
                temp = list[i];
                list[i] = list[j];
                list[j] = temp;
            }
        }
        temp = list[j];
        list[j] = list[pivot];
        list[pivot] = temp;
        quicksort(list, low, j - 1);
        quicksort(list, j + 1, high);
    }
}

int main()
{
    int list[50];
    int size, i;
    clrscr();
    printf("Enter the number of elements (max 50): ");
    scanf("%d", &size);
    if (size < 1 || size > 50)
    {
        printf("Invalid size\n");
        getch();
        return 0;
    }
    printf("Enter the elements to be sorted:\n");
    for (i = 0; i < size; i++)
        scanf("%d", &list[i]);
    quicksort(list, 0, size - 1);
    printf("After applying quick sort\n");
    for (i = 0; i < size; i++)
        printf("%d ", list[i]);
    printf("\n");
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q5">Implement the Binary Search algorithm and demonstrate its working with a dry run on sorted input.</script>
<script type="text/plain" id="c5">
#include <stdio.h>
#include <conio.h>

/* Time : Best O(1), Average/Worst O(log n)   Space: O(log n) recursive
   Dry run: list = 10 20 30 40 50 60 70, key = 60
     lo=0 hi=6 mid=3 -> 40 < 60 -> search right half
     lo=4 hi=6 mid=5 -> 60 == 60 -> found at location 6            */
void binary_search(int list[], int lo, int hi, int key)
{
    int mid;
    if (lo > hi)
    {
        printf("Key not found\n");
        return;
    }
    mid = (lo + hi) / 2;
    printf("lo=%d hi=%d mid=%d value=%d\n", lo, hi, mid, list[mid]);
    if (list[mid] == key)
        printf("Key found at %d location\n", mid + 1);
    else if (list[mid] > key)
        binary_search(list, lo, mid - 1, key);
    else
        binary_search(list, mid + 1, hi, key);
}

int main()
{
    int key, size, i;
    int list[25];
    clrscr();
    printf("Enter size of a list (max 25): ");
    scanf("%d", &size);
    if (size < 1 || size > 25)
    {
        printf("Invalid size\n");
        getch();
        return 0;
    }
    printf("Enter elements in Ascending order\n");
    for (i = 0; i < size; i++)
        scanf("%d", &list[i]);
    printf("\nEnter key to search\n");
    scanf("%d", &key);
    binary_search(list, 0, size - 1, key);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q6">Implement Dijkstra's Algorithm to find the single-source shortest path in a weighted graph.</script>
<script type="text/plain" id="c6">
#include <stdio.h>
#include <limits.h>
#include <conio.h>
#define V 6

/* Time O(V^2) with adjacency matrix, Space O(V). Non-negative weights only. */
int minDistance(int dist[], int visited[])
{
    int min = INT_MAX;
    int min_index = -1;
    int v;
    for (v = 0; v < V; v++)
    {
        if (!visited[v] && dist[v] < min)
        {
            min = dist[v];
            min_index = v;
        }
    }
    return min_index;
}

void printSolution(int dist[])
{
    char vertex[V] = {'s', 'a', 'b', 'c', 'd', 'e'};
    int i;
    printf("Vertex\tDistance from Source (s)\n");
    for (i = 0; i < V; i++)
    {
        if (dist[i] == INT_MAX)
            printf("%c\tINF\n", vertex[i]);
        else
            printf("%c\t%d\n", vertex[i], dist[i]);
    }
}

void dijkstra(int graph[V][V], int src)
{
    int dist[V];
    int visited[V];
    int i, count, u, v;

    for (i = 0; i < V; i++)
    {
        dist[i] = INT_MAX;
        visited[i] = 0;
    }
    dist[src] = 0;

    for (count = 0; count < V; count++)
    {
        u = minDistance(dist, visited);
        if (u == -1)
            break;
        visited[u] = 1;
        for (v = 0; v < V; v++)
        {
            if (!visited[v] && graph[u][v] != 0 &&
                dist[u] + graph[u][v] < dist[v])
            {
                dist[v] = dist[u] + graph[u][v];
            }
        }
    }
    printSolution(dist);
}

int main()
{
    /* Vertex order: s, a, b, c, d, e */
    int graph[V][V] = {
        {0, 1, 5, 0, 0, 0},
        {0, 0, 2, 2, 1, 0},
        {0, 0, 0, 0, 2, 0},
        {0, 0, 0, 0, 3, 1},
        {0, 0, 0, 0, 0, 2},
        {0, 0, 0, 0, 0, 0}
    };
    clrscr();
    dijkstra(graph, 0);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q7">Implement the Fractional Knapsack problem using the Greedy Method and justify the greedy choice (By solving manually). (Sack capacity=15, objects=5, weights={12,1,2,1,4}, profits={4,2,2,1,10})</script>
<script type="text/plain" id="c7">
#include <stdio.h>
#include <conio.h>

/* Greedy choice: take objects in decreasing profit/weight ratio.
   Ratios: o1=0.33  o2=2  o3=1  o4=1  o5=2.5
   Order : o5(4kg), o2(1kg), o3(2kg), o4(1kg) -> 8kg used, 7kg left
           then 7/12 of o1 (profit 4*7/12 = 2.33)
   Total profit = 10 + 2 + 2 + 1 + 2.33 = 17.33 rupees
   Why greedy is optimal: any unit of capacity is best spent on the highest
   ratio item; swapping a unit to a lower-ratio item can only reduce profit.
   Time O(n^2) here (O(n log n) with sorting). */
int n = 5;
int c[10] = {12, 1, 2, 1, 4};   /* weights */
int v[10] = {4, 2, 2, 1, 10};   /* profits */
int W = 15;                     /* capacity */

void simple_fill()
{
    int cur_w;
    float tot_v;
    int i, maxi;
    int used[10];

    tot_v = 0;
    for (i = 0; i < n; ++i)
        used[i] = 0;

    cur_w = W;
    while (cur_w > 0)
    {
        maxi = -1;
        for (i = 0; i < n; ++i)
            if (used[i] == 0 &&
                (maxi == -1 || (float)v[i] / c[i] > (float)v[maxi] / c[maxi]))
                maxi = i;

        if (maxi == -1)
            break;          /* all objects taken */

        used[maxi] = 1;
        cur_w -= c[maxi];

        if (cur_w >= 0)
        {
            tot_v += v[maxi];
            printf("Added object %d (%d Rs, %d Kg) completely. Space left: %d.\n",
                   maxi + 1, v[maxi], c[maxi], cur_w);
        }
        else
        {
            tot_v += (1 + (float)cur_w / c[maxi]) * v[maxi];
            printf("Added %d%% (%d Rs, %d Kg) of object %d in the bag.\n",
                   (int)((1 + (float)cur_w / c[maxi]) * 100),
                   v[maxi], c[maxi], maxi + 1);
        }
    }
    printf("Filled the bag with objects worth %.2f Rs.\n", tot_v);
}

int main()
{
    clrscr();
    simple_fill();
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q8">Implement the All-Pairs Shortest Path solution using the Floyd-Warshall Dynamic Programming algorithm.</script>
<script type="text/plain" id="c8">
#include <stdio.h>
#include <conio.h>
#define V 4
#define INF 9999

/* Time O(V^3), Space O(V^2) */
void printSolution(int dist[][V])
{
    int i, j;
    for (i = 0; i < V; i++)
    {
        for (j = 0; j < V; j++)
        {
            if (dist[i][j] >= INF)
                printf("%7s", "INF");
            else
                printf("%7d", dist[i][j]);
        }
        printf("\n");
    }
}

void floydWarshall(int graph[][V])
{
    int dist[V][V];
    int i, j, k;

    for (i = 0; i < V; i++)
        for (j = 0; j < V; j++)
            dist[i][j] = graph[i][j];

    for (k = 0; k < V; k++)
    {
        for (i = 0; i < V; i++)
            for (j = 0; j < V; j++)
                if (dist[i][k] + dist[k][j] < dist[i][j])
                    dist[i][j] = dist[i][k] + dist[k][j];
        printf("\nIteration %d (via vertex %d):\n", k + 1, k + 1);
        printSolution(dist);
    }
    printf("\nFinal shortest distance matrix:\n");
    printSolution(dist);
}

int main()
{
    int graph[V][V] = {
        {0,   3,   INF, 7},
        {8,   0,   2,   INF},
        {5,   INF, 0,   1},
        {2,   INF, INF, 0}
    };
    clrscr();
    printf("Iteration 0 (initial):\n");
    printSolution(graph);
    floydWarshall(graph);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q9">Implement the Travelling Salesperson Problem using the Dynamic Programming approach and analyze its complexity.</script>
<script type="text/plain" id="c9">
#include <stdio.h>
#include <conio.h>
#define MAXN 10
#define INF 9999

/* Held-Karp DP: dp[mask][i] = min cost to start at city 1, visit the set
   'mask' and end at city i.
   Time O(n^2 * 2^n), Space O(n * 2^n)  (brute force is O(n!)) */
int cost[MAXN][MAXN];
int dp[1024][MAXN];
int par[1024][MAXN];

int main()
{
    int n, i, j, mask, full, nm, val, best, last;
    int path[MAXN + 1];
    int k;

    clrscr();
    printf("Enter number of cities (2 to %d): ", MAXN);
    scanf("%d", &n);
    if (n < 2 || n > MAXN)
    {
        printf("Invalid number\n");
        getch();
        return 0;
    }
    printf("Enter the cost matrix (%d x %d):\n", n, n);
    for (i = 0; i < n; i++)
        for (j = 0; j < n; j++)
            scanf("%d", &cost[i][j]);

    full = (1 << n) - 1;
    for (mask = 0; mask <= full; mask++)
        for (i = 0; i < n; i++)
        {
            dp[mask][i] = INF;
            par[mask][i] = -1;
        }
    dp[1][0] = 0;

    for (mask = 1; mask <= full; mask++)
    {
        if (!(mask & 1)) continue;
        for (i = 0; i < n; i++)
        {
            if (!(mask & (1 << i)) || dp[mask][i] >= INF) continue;
            for (j = 0; j < n; j++)
            {
                if (mask & (1 << j)) continue;
                nm = mask | (1 << j);
                val = dp[mask][i] + cost[i][j];
                if (val < dp[nm][j])
                {
                    dp[nm][j] = val;
                    par[nm][j] = i;
                }
            }
        }
    }

    best = INF;
    last = -1;
    for (i = 1; i < n; i++)
    {
        if (dp[full][i] < INF && dp[full][i] + cost[i][0] < best)
        {
            best = dp[full][i] + cost[i][0];
            last = i;
        }
    }

    if (last == -1)
        printf("No tour possible\n");
    else
    {
        k = 0;
        mask = full;
        i = last;
        while (i != -1)
        {
            path[k++] = i;
            j = par[mask][i];
            mask = mask & ~(1 << i);
            i = j;
        }
        printf("\nOptimal path: ");
        while (k > 0)
            printf("%d--->", path[--k] + 1);
        printf("1\n");
        printf("Minimum cost is %d\n", best);
    }
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q10">Implement the N-Queens problem using the Backtracking technique and display all valid solutions. (N=4, N=8, etc.)</script>
<script type="text/plain" id="c10">
#include <stdio.h>
#include <stdlib.h>
#include <conio.h>

/* Time O(n!) worst case (heavily pruned), Space O(n)
   N=4 has 2 solutions, N=8 has 92 solutions.
   N is limited to 12: int is 16-bit in Turbo C (max 32767) and N=13 has
   73712 solutions, which would overflow the counter. */
int board[20], count;

void print(int n)
{
    int i, j;
    printf("\n\nSolution %d:\n\n", ++count);
    for (i = 1; i <= n; ++i)
        printf("\t%d", i);
    for (i = 1; i <= n; ++i)
    {
        printf("\n\n%d", i);
        for (j = 1; j <= n; ++j)
        {
            if (board[i] == j)
                printf("\tQ");
            else
                printf("\t-");
        }
    }
}

/* returns 1 if no column/diagonal conflict, else 0 */
int place(int row, int column)
{
    int i;
    for (i = 1; i <= row - 1; ++i)
    {
        if (board[i] == column)
            return 0;
        if (abs(board[i] - column) == abs(i - row))
            return 0;
    }
    return 1;
}

void queen(int row, int n)
{
    int column;
    for (column = 1; column <= n; ++column)
    {
        if (place(row, column))
        {
            board[row] = column;
            if (row == n)
                print(n);
            else
                queen(row + 1, n);
        }
    }
}

int main()
{
    int n;
    clrscr();
    printf(" - N Queens Problem Using Backtracking -");
    printf("\n\nEnter number of Queens (1 to 12): ");
    scanf("%d", &n);
    if (n < 1 || n > 12)
    {
        printf("Invalid input\n");
        getch();
        return 0;
    }
    count = 0;
    queen(1, n);
    printf("\n\nTotal solutions = %d", count);
    getch();
    return 0;
}
</script>

<script type="text/plain" id="q11">Implement the Knuth-Morris-Pratt (KMP) String Matching algorithm and explain the prefix function preprocessing for: Pattern: ababada, Text: badbabababadaab</script>
<script type="text/plain" id="c11">
#include <stdio.h>
#include <string.h>
#include <conio.h>

/* Prefix function (LPS) for "ababada":
     index   0 1 2 3 4 5 6
     pattern a b a b a d a
     lps     0 0 1 2 3 0 1
   lps[i] = length of longest proper prefix of pat[0..i] that is also its suffix.
   On mismatch, j = lps[j-1] so the text pointer never moves backward.
   Time O(n + m), Space O(m). Expected match at index 6. */
void prefixSuffixArray(char *pat, int M, int *lps)
{
    int length = 0;
    int i = 1;
    lps[0] = 0;
    while (i < M)
    {
        if (pat[i] == pat[length])
        {
            length++;
            lps[i] = length;
            i++;
        }
        else
        {
            if (length != 0)
                length = lps[length - 1];
            else
            {
                lps[i] = 0;
                i++;
            }
        }
    }
}

void KMPAlgorithm(char *text, char *pattern)
{
    int M = strlen(pattern);
    int N = strlen(text);
    int lps[50];
    int i = 0;
    int j = 0;
    int k;

    prefixSuffixArray(pattern, M, lps);

    printf("LPS Array: ");
    for (k = 0; k < M; k++)
        printf("%d ", lps[k]);
    printf("\nPattern found at index:\n");

    while (i < N)
    {
        if (pattern[j] == text[i])
        {
            i++;
            j++;
        }
        if (j == M)
        {
            printf("%d\n", i - j);
            j = lps[j - 1];
        }
        else if (i < N && pattern[j] != text[i])
        {
            if (j != 0)
                j = lps[j - 1];
            else
                i++;
        }
    }
}

int main()
{
    char text[] = "badbabababadaab";
    char pattern[] = "ababada";
    clrscr();
    KMPAlgorithm(text, pattern);
    getch();
    return 0;
}
</script>

<script>
(function () {
  var TOTAL = 11;
  var KEYWORDS = {
    "int":1,"char":1,"void":1,"float":1,"double":1,"long":1,"short":1,"unsigned":1,
    "signed":1,"return":1,"if":1,"else":1,"for":1,"while":1,"do":1,"break":1,
    "continue":1,"sizeof":1,"struct":1,"const":1,"static":1,"switch":1,"case":1
  };

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function getText(id) {
    var el = document.getElementById(id);
    // textContent of a type="text/plain" script is the raw source, untouched
    return el.textContent;
  }

  // strip only the single newline that follows the opening <script> tag
  // and the one before the closing tag, so the code is otherwise identical
  function cleanCode(raw) {
    return raw.replace(/^\r?\n/, "").replace(/\r?\n$/, "");
  }

  function highlight(code) {
    var re = /(\/\*[\s\S]*?\*\/)|(^[ \t]*#.*$)|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/gm;
    var out = "", last = 0, m;
    while ((m = re.exec(code)) !== null) {
      out += esc(code.slice(last, m.index));
      var t = m[0];
      if (m[1])      out += '<span class="t-com">' + esc(t) + '</span>';
      else if (m[2]) out += '<span class="t-pre">' + esc(t) + '</span>';
      else if (m[3] || m[4]) out += '<span class="t-str">' + esc(t) + '</span>';
      else if (m[5]) out += '<span class="t-num">' + esc(t) + '</span>';
      else if (m[6] && KEYWORDS.hasOwnProperty(t)) out += '<span class="t-kw">' + esc(t) + '</span>';
      else out += esc(t);
      last = m.index + t.length;
    }
    out += esc(code.slice(last));
    return out;
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  }

  var app = document.getElementById("app");
  var tabs = document.getElementById("tabs");

  for (var n = 1; n <= TOTAL; n++) {
    (function (n) {
      var question = getText("q" + n).trim();
      var code = cleanCode(getText("c" + n));

      var tab = document.createElement("a");
      tab.href = "#win" + n;
      tab.textContent = n;
      tabs.appendChild(tab);

      var win = document.createElement("section");
      win.className = "win";
      win.id = "win" + n;
      win.innerHTML =
        '<div class="title">' +
          '<span class="box">[&#9632;]</span>' +
          '<span class="name">PRAC' + (n < 10 ? "0" + n : n) + '.C</span>' +
          '<span class="num">' + n + '</span>' +
        '</div>' +
        '<div class="qrow">' +
          '<div class="question"><span class="qno">Q' + n + '.</span> ' + esc(question) + '</div>' +
          '<button class="btn" type="button">[ Copy Code ]</button>' +
        '</div>' +
        '<div class="code-area"><pre></pre></div>';

      win.querySelector("pre").innerHTML = highlight(code);

      var btn = win.querySelector(".btn");
      btn.addEventListener("click", function () {
        copyText(code, function (ok) {
          btn.textContent = ok ? "[ Copied! ]" : "[ Press Ctrl+C ]";
          btn.classList.add("done");
          setTimeout(function () {
            btn.textContent = "[ Copy Code ]";
            btn.classList.remove("done");
          }, 1600);
        });
      });

      app.appendChild(win);
    })(n);
  }
})();
</script>
</body>
</html>
